databases:
  - name: expense-db
    databaseName: expensetracker
    user: root
    plan: free

services:
  # Backend Service
  - type: web
    name: backend
    env: docker
    dockerContext: backend/ExpenseTracker
    dockerfilePath: backend/ExpenseTracker/Dockerfile
    plan: free
    envVars:
      # Render provides DATABASE_URL automatically, but we set it explicitly to be certain
      - key: DATABASE_URL
        fromDatabase:
          name: expense-db
          property: connectionString
      # We blank out these old variables to prevent them from interfering with the new logic
      - key: SPRING_DATASOURCE_URL
        value: ""
      - key: BULLET_DB_HOST
        value: ""
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # Frontend Service
  - type: web
    name: frontend
    env: docker
    dockerContext: frontend/expense-tracker-frontend
    dockerfilePath: frontend/expense-tracker-frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: backend
          property: host
