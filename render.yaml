databases:
  - name: expense-db
    databaseName: expensetracker
    user: root
    plan: free

services:
  # Backend Service
  - type: web
    name: backend
    env: docker
    dockerContext: backend/ExpenseTracker
    dockerfilePath: backend/ExpenseTracker/Dockerfile
    plan: free
    envVars:
      - key: RENDER_PG_HOST
        fromDatabase:
          name: expense-db
          property: host
      - key: RENDER_PG_PORT
        fromDatabase:
          name: expense-db
          property: port
      - key: RENDER_PG_DB
        fromDatabase:
          name: expense-db
          property: database
      - key: RENDER_PG_USER
        fromDatabase:
          name: expense-db
          property: user
      - key: RENDER_PG_PASS
        fromDatabase:
          name: expense-db
          property: password
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # Frontend Service
  - type: web
    name: frontend
    env: docker
    dockerContext: frontend/expense-tracker-frontend
    dockerfilePath: frontend/expense-tracker-frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_URL
        value: http://backend:8080
