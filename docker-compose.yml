services:
  database:
    image: mysql:8.0
    container_name: expense-db
    environment:
      MYSQL_DATABASE: expensetracker
      MYSQL_ROOT_PASSWORD: Mahajan28@
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

  backend:
    build: ./backend/ExpenseTracker
    container_name: expense-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/expensetracker
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Mahajan28@
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - database

  frontend:
    build: ./frontend/expense-tracker-frontend
    container_name: expense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
